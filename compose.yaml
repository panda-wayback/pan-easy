services:
  baidu-easy:
    build: .
    image: baidu-easy:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:28080:8080"
      - "28081:8081"
    environment:
      BAIDU_EASY_API_KEY: ${BAIDU_EASY_API_KEY:?请先设置 BAIDU_EASY_API_KEY}
      SPARK_AUTH_URL: ${SPARK_AUTH_URL:-http://host.docker.internal:8000}
      SHOP_BYTES_PER_USE: ${SHOP_BYTES_PER_USE:-300}  # 单位 MB，300 即每 300MB 扣 1 次
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - baidu-easy-data:/data
      - ./downloads:/downloads

volumes:
  baidu-easy-data:
