services:
  baidu-easy:
    build: .
    image: baidu-easy:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:28080:8080"
    environment:
      BAIDU_EASY_API_KEY: ${BAIDU_EASY_API_KEY:?请先设置 BAIDU_EASY_API_KEY}
    volumes:
      - baidu-easy-data:/data
      - ./downloads:/downloads

  shop:
    build: ./shop
    image: baidu-easy-shop:latest
    restart: unless-stopped
    depends_on:
      - baidu-easy
    ports:
      - "28081:8080"
    environment:
      SHOP_ACCESS_KEY: ${SHOP_ACCESS_KEY:?请先设置 SHOP_ACCESS_KEY}
      BAIDU_EASY_API_KEY: ${BAIDU_EASY_API_KEY:?请先设置 BAIDU_EASY_API_KEY}
      BAIDU_EASY_URL: http://baidu-easy:8080

volumes:
  baidu-easy-data:
