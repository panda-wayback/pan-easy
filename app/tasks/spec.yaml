name: tasks
function: 分享下载任务队列：从分享文字识别链接和提取码，后台逐个下载到下载目录
modules: []
input:
  - name: text
    type: string
    desc: 用户粘贴的百度网盘分享文字
  - name: download_dir
    type: path
    desc: 服务器上的下载目录
  - name: tasks_file
    type: path, optional
    desc: 任务历史文件；不提供时只保存在内存中
output:
  - name: task
    type: JSON {id, url, status, progress, speed?, downloaded?, total?, eta?, saved_to, pan_path?, result?, error?, created_at, finished_at?}
    desc: status 取值 queued / running / done / failed / submitted；progress 为 0-100；speed 为字节/秒；downloaded、total 为字节；eta 为剩余秒数；saved_to 为服务器下载目录内的位置；pan_path 为网盘中的保存位置；result 为 bdpan 返回结果；error 为 {code, message, errno?, hint?}；未知的字段为 null
contract:
  - 链接取文字中第一个 pan.baidu.com/s/ 分享链接；提取码优先取链接中的 pwd 参数，否则取文字中的“提取码：xxxx”
  - 文字中没有分享链接时拒绝提交，不创建任务
  - 同一时刻只执行一个任务，按提交顺序执行
  - 进度从 bdpan 运行中的输出实时读取，只增不减；完成时为 100
  - speed、downloaded、total、eta 从 bdpan 进度行“(已下载/总大小, 速度) [已用:剩余]”实时解析，单位按 1000 进制；运行中为近似值
  - 完成时 total 与 downloaded 取 bdpan 结果中的文件大小合计，speed、eta 置 null；失败时 speed、eta 置 null
  - pan_path 取 bdpan 结果中的转存位置：单个文件为该文件的网盘路径，否则为转存目录；完成后才有值
  - bdpan 返回“已提交”时任务状态为 submitted，保留 bdpan 返回的任务信息，不当作完成
  - 失败时保留 bdpan 的错误码与原因
  - 文件直接下载到下载目录；saved_to 为下载目录内的实际位置
  - 提供 tasks_file 时任务历史持久化：提交、开始、结束时整体写入（先写临时文件再替换）；运行中的进度与速度不写入；从文字中单独识别的提取码不写入（链接自带的 pwd 参数随链接保留）
  - 启动时读取 tasks_file；其中 queued / running 的任务标记为 failed，error.code 为 interrupted，不自动重新执行
  - 历史不限条数，不提供删除
depends:
  - app/bdpan
errors:
  - code: invalid_argument
    desc: 文字中没有分享链接
  - code: not_logged_in
    desc: 任务失败原因：未登录
  - code: token_expired
    desc: 任务失败原因：Token 失效
  - code: bdpan_error
    desc: 任务失败原因：提取码错误、链接失效、空间不足等，携带 errno
  - code: interrupted
    desc: 任务失败原因：服务重启时任务尚未完成
tests:
  - 分享文字识别：链接带 pwd、文字中单独写提取码、两者都有、无提取码、无链接
  - 用替身 bdpan 验证多个任务按提交顺序逐个执行，不并发
  - 进度随输出更新且只增不减；完成为 100
  - 进度行解析出速度、已下载、总大小、剩余时间；输出分段到达时也能解析；完成后 total 为精确大小、speed 与 eta 为 null
  - 完成后 saved_to 与 pan_path 对应 bdpan 结果中的文件
  - 失败保留错误码与原因；“已提交”结果对应 submitted 状态
  - 历史持久化：完成的任务在新建队列后仍可查到；未完成的任务重新加载后为 interrupted；文件中不含提取码
