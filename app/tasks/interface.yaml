name: tasks
function: 分享下载任务队列：从分享文字识别链接和提取码，依次做本地缓存、云盘去重与任务合并短路后，后台下载到下载目录
modules: []
input:
  - name: text
    type: string
    desc: 用户粘贴的百度网盘分享文字；用于提交任务
  - name: preview
    type: string
    desc: 用户粘贴的百度网盘分享文字；只读查询分享信息，不创建任务、不转存、不下载
  - name: download_dir
    type: path
    desc: 服务器上的下载目录
  - name: tasks_file
    type: path, optional
    desc: 任务历史文件；不提供时只保存在内存中
  - name: transfer_timeout
    type: seconds, optional
    desc: 转存已提交后等待网盘出现转存结果的最长时间；默认 1800
  - name: transfer_poll_interval
    type: seconds, optional
    desc: 等待转存结果时查询网盘的间隔；默认 10
  - name: max_downloads
    type: integer, optional
    desc: 转存完成后同时下载的任务上限；默认 2，设为 1 即逐个执行
  - name: max_task_bytes
    type: integer
    desc: 单次任务分享文件总大小上限（字节，1000 进制）；必须 > 0；默认 10000000000（10GB）
  - name: cleanup_interval
    type: seconds, optional
    desc: 定时维护清理间隔；默认 3600；设为 0 关闭定时维护（按任务腾空间仍执行）
  - name: cleanup_min_age
    type: seconds, optional
    desc: 交付物闲置超过该秒数才可被清理；默认 604800（7 天）
  - name: touch_download
    type: path（下载目录内相对路径）
    desc: 刷新该交付物的最近使用时间；路径不存在或越界时忽略
  - name: check_space
    type: integer（所需字节数）
    desc: 按需清理冷交付物后检查下载目录是否有足够可用空间；足够返回当前可用字节，不足抛 DiskFull
output:
  - name: task
    type: JSON {id, url, status, progress, speed?, downloaded?, total?, eta?, saved_to, pan_path?, result?, error?, created_at, finished_at?, alias_of?}
    desc: status 取值 queued / running / submitted / done / failed，其中 queued、running、submitted 为未结束状态，submitted 表示网盘端转存仍在处理、完成后自动下载；progress 为 0-100；speed 为字节/秒；downloaded、total 为字节；eta 为剩余秒数；saved_to 为服务器下载目录内的位置；pan_path 为网盘中的保存位置；result 为 bdpan 返回结果；error 为 {code, message, errno?, hint?}；alias_of 非空时本任务与该 ID 的任务内容完全重叠、不重复执行，其 status/progress/speed/downloaded/total/eta/saved_to/pan_path/result/error/finished_at 均与该任务一致，仅 id、url、created_at 为自身值；未知的字段为 null
  - name: preview
    type: JSON {total_bytes, names}
    desc: total_bytes 为分享中全部文件大小合计（字节，1000 进制），含嵌套目录内文件；不含目录自身大小；names 为全部文件名列表（不含目录），深度优先、同层与 transfer list 顺序一致
contract:
  - 链接取文字中第一个 pan.baidu.com/s/ 分享链接；提取码优先取链接中的 pwd 参数，否则取文字中的“提取码：xxxx”
  - 文字中没有分享链接时拒绝提交与预览，不创建任务
  - 预览只调用 transfer list（只读），遇目录则用 --source-dir 递归列出子项并翻页直至 has_more 为假；合计全部文件 size 与 names；不创建任务、不写入 tasks_file、不占用转存与下载名额；链接失效、提取码错误等以 bdpan 错误原样返回；预览不因超限失败
  - 任务开始先只读查询分享顶层条目（transfer list，不占转存/下载名额）；若顶层含目录，先用只读 transfer list 递归（--source-dir）把目录展开为文件（与预览同一套逻辑，不转存）；后续各级都按展开后的文件处理；展开后没有任何文件时任务失败，不转存、不下载
  - 任务按提交顺序开始；若分享文件总大小（不含目录）大于 max_task_bytes，任务失败，error.code 为 task_too_large，不转存、不下载
  - 随后按以下顺序短路，前一步命中则不再执行后续步骤
  - 第一步 本地缓存（扫盘文件比对，不依赖任务历史）：单文件在 downloads/<大小>/<任务ID>/文件名 结构下找同名同大小文件；多文件扫描 downloads/<大小>/*.zip，只读 zip 中央目录，非目录成员的「文件名+大小」集合与分享中全部文件条目（不含目录，含已展开的目录内文件）完全一致则命中；命中后直接完成并复用该路径，刷新该交付物最近使用时间，不再查询网盘、转存与下载；分享中无可比对的文件条目时跳过本步；空目录不参与复用
  - 本地缓存未命中、即将占用本地下载空间前：若下载目录可用空间小于本任务所需字节数，则按最近使用时间从旧到新删除闲置超过 cleanup_min_age 的交付物，直到空间足够或无可删项；清理后仍不足则任务失败，error.code 为 disk_full，不开始下载；缓存命中不走本步
  - check_space(need) 供调用方在创建计费任务前预检：逻辑与上条腾空间相同，不足抛 DiskFull
  - cleanup_interval > 0 时按该间隔定时维护：删除闲置超过 cleanup_min_age 的交付物；并清理空目录，以及目录内全部文件均已闲置超过 cleanup_min_age、且无运行中任务占用的残留工作目录（以文件 mtime 为准，不用目录 mtime）；cleanup_interval 为 0 时不做定时维护
  - 交付物完成写入后刷新其最近使用时间；调用方可通过 touch_download(相对路径) 在生成下载链接或 /dl 传输时刷新同一交付物的最近使用时间
  - 最近使用时间用交付物文件的 mtime 表示（显式更新）；清理只删磁盘交付物，不删任务历史
  - 第二步 云盘去重：在自己网盘 /apps/bdpan/ 下按同名同大小查找（目录已提前展开为文件）；单文件命中则免转存；全部文件均命中才免转存，否则整包转存；免转存时直接从命中路径下载；需要转存时转存阶段全局串行（同一百度账号同时只允许一个转存）
  - 转存目标为相对路径「整理/YYYYMM/6 位十六进制随机」（即 我的应用数据/bdpan/整理/<月份>/<随机>/）；通过 bdpan transfer -d 指定；不含 task_id
  - 转存时 bdpan 返回“已提交”则任务为 submitted，持转存锁按 transfer_poll_interval 轮询等待，不占用下载并发名额；transfer_timeout 内未出现全部转存结果时失败
  - 转存失败且 errno 为 13045（自己分享的链接）：在整个网盘按同名同大小查找分享中的全部文件（含目录条目则不查找、仍按原错误失败）；全部找到则直接从网盘路径下载；任一找不到则仍以原 13045 错误失败
  - 第三步 任务合并：免转存、自己分享直下或转存完成后、真正发起下载之前，只与其它未结束任务（queued / running / submitted）做重叠判定：规范化后分享链接相同，或分享条目逐个同名、同类型、同大小即完全重叠（部分重叠不合并）；命中时标记 alias_of 为被重叠任务 ID，立即结束，不再下载；已完成（done）任务不参与合并——文件复用只走第一步本地缓存，不依赖任务历史
  - 免转存或转存得到网盘路径后、下载前：若分享条目含目录，则递归列出各目录下全部文件，将条目与路径展开为文件列表；展开后为空则失败；展开后的文件 size 合计用于工作目录分层与进度 total
  - 未命中合并时进入下载阶段：最多 max_downloads 个任务同时下载到本地；max_downloads 为 1 时逐个执行
  - 被重叠任务结束前，重叠任务的进度等字段始终与其一致；被重叠任务失败时重叠任务同样失败；重试重叠任务时新建任务并自行执行
  - 重叠任务生成下载链接时指向被重叠任务的同一文件（链接中的任务 ID 为被重叠任务 ID）
  - 进度只增不减；完成时为 100；多文件串行下载时按整包汇总，不以单个文件进度覆盖任务字段
  - total 在开始下载前取分享中全部文件条目 size 之和（不含目录）；运行中 downloaded 为已完成文件 size 之和加上当前文件已下载字节；speed 取当前文件进度行速度；eta 按（total−downloaded）/speed 估算；单位按 1000 进制；运行中为近似值
  - 单文件时仍从 bdpan 进度行解析 downloaded/total/speed，并与条目 size 对齐；完成时 total 与 downloaded 均为分享文件 size 合计，speed、eta 置 null；失败时 speed、eta 置 null
  - pan_path 取 bdpan 结果中的转存位置：单个文件为该文件的网盘路径，否则为转存目录；完成后才有值
  - submitted 期间在转存目录（result 中的 target_dir 或 saved_path；单个文件时也在网盘 /apps/bdpan/ 下搜索）按名称与大小查找分享中的全部文件，全部找到后状态回到 running 并进入第三步；完成后的字段与直接下载完成时一致
  - transfer_timeout 内未找到全部转存结果时任务失败，error.code 为 transfer_timeout
  - 失败时保留 bdpan 的错误码与原因
  - 文件下载到下载目录内按「分享文件 size 合计 / 任务 ID」划分：工作目录为「总大小/任务ID/」；仅在真正开始下载前创建该目录；若目录已存在：内部无文件则删除重建，有残留文件则清空后重建；单文件调用 bdpan download 时本地目标为「总大小/任务ID/文件名」完整路径；每个文件下载结束后校验本地文件存在且（已知 size 时）大小相符，否则任务失败并清理空工作目录；saved_to 为下载目录内的实际位置
  - 多文件（含目录展开后多于一个文件）：各文件下载到「总大小/任务ID/」后打成并列的「总大小/任务ID.zip」；目录展开后仅一个文件则按单文件交付、不打包；zip 在临时目录生成后再移入；打包完成后必须读 zip 中央目录，成员「文件名+大小」与展开后的文件条目完全一致才把 saved_to 设为该 zip；不得把工作目录或空目录写入 saved_to；校验失败或 zip 不存在则任务失败并清理坏 zip/空目录；打包在线程中执行；内容相同的重复任务经第一步按 zip 成员比对复用，复用前同样校验 zip 为文件且成员一致
  - 提供 tasks_file 时任务历史持久化：提交、开始、结束、删除、重试后整体写入（先写临时文件再替换）；运行中的进度与速度不写入；从文字中单独识别的提取码不写入（链接自带的 pwd 参数随链接保留）
  - 启动时读取 tasks_file；其中 queued / running / submitted 的任务标记为 failed，error.code 为 interrupted，不自动重新执行
  - 历史不限条数；支持删除单条任务记录，已下载的文件不删除
  - 支持重试 failed / interrupted 的任务：复制原分享链接与提取码，创建一个新任务 ID 并排队执行；原记录保留
depends:
  - app/bdpan
errors:
  - code: invalid_argument
    desc: 文字中没有分享链接
  - code: not_logged_in
    desc: 任务失败原因：未登录
  - code: token_expired
    desc: 任务失败原因：Token 失效
  - code: bdpan_error
    desc: 任务失败原因：提取码错误、链接失效、空间不足等，携带 errno
  - code: interrupted
    desc: 任务失败原因：服务重启时任务尚未完成
  - code: transfer_timeout
    desc: 任务失败原因：转存已提交，但在 transfer_timeout 内未在网盘中找到全部转存结果
  - code: task_too_large
    desc: 任务失败原因：分享文件总大小超过 max_task_bytes
  - code: disk_full
    desc: 任务失败原因：下载前腾空间后可用空间仍不足本任务所需
tests:
  - 分享文字识别：链接带 pwd、文字中单独写提取码、两者都有、无提取码、无链接
  - 预览：无链接拒绝且不调用 bdpan；有链接时 transfer list 递归展开目录（--source-dir）后返回全部文件大小合计与文件名列表，不创建任务、不写 tasks_file；链接失效等错误原样返回且不创建任务
  - 用替身 bdpan 验证：转存阶段严格串行，转存完成后的下载阶段最多 max_downloads 个任务同时进行；max_downloads 为 1 时逐个执行
  - 本地缓存：单文件子目录同名同大小命中；多文件 zip 成员名+大小与分享文件条目一致时命中（可不依赖任务历史）；不调用网盘查询、转存与下载，且优先于其余两级
  - 云盘去重：单文件在网盘 /apps/bdpan/ 下同名同大小命中时免转存；多文件全部命中才免转存；部分命中或不完整时仍转存
  - 转存路径：transfer 带 -d 为 整理/YYYYMM/6位随机
  - 自己分享（errno 13045）：全盘按同名同大小找到后直接下载且不转存；找不到或含目录条目时仍失败并保留 13045
  - 单文件下载：传给 bdpan 的本地路径为 总大小/任务ID/文件名，不是任务目录本身
  - 下载前工作目录：空目录删除重建；有残留则清空；转存/合并短路不创建空目录
  - 下载后校验：本地文件缺失或大小不符则 failed，不留下空目录冒充完成
  - 重叠合并：仅与未结束任务合并；链接相同或条目逐个同名同大小时后一任务在下载前标记 alias_of、不产生下载，其状态、进度与结果实时跟随被重叠任务，完成后链接指向同一文件；部分重叠不合并；被重叠任务失败时重叠任务同样失败；已完成任务不参与合并，同内容复用只靠本地文件缓存
  - 进度随输出更新且只增不减；完成为 100
  - 多文件进度为整包：total 为条目 size 之和，downloaded 含已完成文件；完成后 downloaded 等于 total，speed 与 eta 为 null
  - 进度行解析出速度；输出分段到达时也能解析；单文件完成后 total 为精确大小、speed 与 eta 为 null
  - 完成后 saved_to 与 pan_path 对应 bdpan 结果中的文件；多文件完成后 saved_to 为 总大小/任务ID.zip
  - 失败保留错误码与原因
  - 目录分享：转存前用只读 transfer list 递归展开为文件；展开后单文件不打包、多文件打 zip；展开为空则 failed（不转存）
  - 多文件打包：只打包本次下载的文件列表；移入后校验 zip 成员名+大小；saved_to 仅为通过校验的 zip 路径，绝不为目录；无文件可打包或校验失败时 failed
  - 多文件复用：仅当路径为真实 .zip 文件且中央目录成员与分享条目一致时命中；空目录、散文件目录不参与多文件复用
  - “已提交”：先为 submitted；转存结果出现在 target_dir 后从网盘路径下载，最终 done 且 saved_to、pan_path、total 对应网盘下载结果；submitted 等待期间其他任务的转存不执行、下载可继续
  - “已提交”且没有目录信息：单个文件通过搜索按名称与大小找到后下载
  - “已提交”后超时未找到：failed，error.code 为 transfer_timeout
  - 重新加载后 submitted 任务为 interrupted
  - 历史持久化：完成的任务在新建队列后仍可查到；未完成的任务重新加载后为 interrupted；文件中不含提取码；下载过程中进度更新不写 tasks_file

  - 删除任务后按 ID 查询返回 404；删除运行中的任务时先取消该任务
  - 重试失败/中断任务返回新任务对象，新任务出现在列表最前面
  - 超限：分享总大小大于 max_task_bytes 时任务 failed，error.code 为 task_too_large，不转存不下载；预览仍返回真实 total_bytes
  - 腾空间：下载前可用空间不足时先删最久未用且闲置超过 cleanup_min_age 的交付物；清后足够则继续下载；仍不足则 failed，error.code 为 disk_full
  - 使用时间：本地缓存命中、完成写入、touch_download 均刷新交付物 mtime；定时维护与腾空间只清理闲置超过 cleanup_min_age 的交付物，并清掉空父目录与无运行中任务的残留工作目录
