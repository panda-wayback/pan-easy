name: web
function: 测试网页：分享下载与登录
modules: []
input: []
output:
  - name: index.html
    type: static page
    desc: 由服务在 GET / 提供的单个静态页面
contract:
  - 只调用本服务 /api/* 接口
  - 左侧边栏切换下载页与登录页；地址 #download / #login 对应页面，默认下载页；侧边栏底部常驻显示登录状态
  - 窄屏时侧边栏变为顶部横向菜单
  - 登录页：访问密钥（输入、保存、清除）；登录状态（进入时自动查询，显示用户名与有效期）；授权登录（显示安全须知并要求勾选确认，显示授权链接，粘贴授权码提交）
  - 密钥只保存在浏览器本地；未设置密钥时下载页提示先到登录页设置
  - 下载页：粘贴分享文字提交任务；任务历史以列表展示，新任务在前，每个任务一张卡片：标题（完成后为文件名，之前为分享链接）与状态标签；进度条、已下载/总大小、下载速度、剩余时间；服务器保存位置、网盘位置、提交时间；失败时显示原因；有未结束任务时每 2 秒刷新
  - 每个操作的结果显示在对应按钮下方一行；接口错误显示 error.code 与 message，有 hint 时优先显示 hint
  - 不依赖前端构建流程与外部 CDN 资源
depends: []
errors: []
tests:
  - 服务 GET / 返回该页面
  - 手动清单：登录页输入密钥 → 授权登录，侧边栏显示已登录 → 下载页粘贴分享文字下载并看到进度和完成 → 错误密钥时显示 unauthorized
