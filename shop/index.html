<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网盘文件下载</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6fa; color: #1f2733;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 8px 0 20px; }
  h1 a { color: inherit; text-decoration: none; }
  .card { background: #fff; border: 1px solid #e4e8ef; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  input, textarea { width: 100%; padding: 9px 12px; border: 1px solid #e4e8ef; border-radius: 8px; font: inherit; }
  textarea { min-height: 96px; resize: vertical; }
  button { border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; background: #2563eb; color: #fff; cursor: pointer; }
  button.ghost { background: #eef2ff; color: #2563eb; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 200px; }
  .msg { font-size: 14px; min-height: 20px; margin-top: 8px; }
  .ok { color: #16a34a; } .err { color: #dc2626; } .warn { color: #d97706; }
  .top { display: flex; justify-content: space-between; gap: 10px; }
  .title { font-weight: 600; word-break: break-all; }
  .tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #eef2f7; white-space: nowrap; height: fit-content; }
  .bar { height: 8px; background: #edf0f5; border-radius: 99px; margin: 10px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #2563eb; }
  .meta { color: #6b7686; font-size: 13px; word-break: break-all; }
  .meta span { margin-right: 14px; }
  .history a { display: block; padding: 10px 0; border-top: 1px solid #e4e8ef; color: #2563eb; text-decoration: none; word-break: break-all; }
  .history a:first-child { border-top: 0; }
  .empty { color: #6b7686; text-align: center; padding: 16px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1><a href="/">网盘文件下载</a></h1>

  <div id="home" class="hidden">
    <div class="card">
      <strong>卡密</strong>
      <div class="meta">每次提交扣 1 次</div>
      <div class="row"><input id="code" type="password" placeholder="输入卡密"></div>
    </div>

    <div class="card">
      <textarea id="share" placeholder="粘贴百度网盘分享文字，例如：&#10;https://pan.baidu.com/s/1xxxx 提取码：abcd"></textarea>
      <div class="row"><button id="submit">提交下载</button></div>
      <div class="msg" id="submit-msg"></div>
    </div>

    <div class="card">
      <strong>我的历史</strong>
      <div class="meta">本浏览器提交过的下载页，24 小时后过期</div>
      <div class="history" id="history"></div>
    </div>
  </div>

  <div id="task" class="hidden">
    <div class="card" id="task-card"></div>
    <a href="/"><button>返回首页，提交新的下载</button></a>
  </div>
</div>

<script>
const HISTORY_STORE = "shop_history";
const STATUS = { queued: "排队中", running: "下载中", done: "完成", failed: "失败", submitted: "网盘转存中，完成后自动下载" };
const ACTIVE = ["queued", "running", "submitted"];
const $ = id => document.getElementById(id);

async function api(method, path, body) {
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let json = null;
  try { json = await res.json(); } catch (e) {}
  if (!json || !json.ok) throw (json && json.error) || { code: "http_" + res.status, message: "请求失败" };
  return json.data;
}

function show(el, cls, text) { el.className = "msg " + cls; el.textContent = text; }
function showErr(el, e) { show(el, "err", e.code + "：" + (e.hint || e.message)); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function localTime(iso) { return new Date(iso).toLocaleString(); }

function bytes(n) {
  const u = ["B", "kB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}
function eta(s) {
  if (s >= 3600) return Math.floor(s / 3600) + "小时" + Math.floor(s % 3600 / 60) + "分";
  if (s >= 60) return Math.floor(s / 60) + "分" + s % 60 + "秒";
  return s + "秒";
}

// ---- 首页 ----------------------------------------------------------

function history() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(HISTORY_STORE)) || []; } catch (e) {}
  const alive = list.filter(h => new Date(h.expires_at) > new Date());
  if (alive.length !== list.length) localStorage.setItem(HISTORY_STORE, JSON.stringify(alive));
  return alive;
}

function renderHistory() {
  const list = history();
  $("history").innerHTML = list.length
    ? list.map(h => `<a href="${esc(h.page)}">${esc(h.url)}<div class="meta">提交于 ${esc(localTime(h.created_at))}，过期于 ${esc(localTime(h.expires_at))}</div></a>`).join("")
    : `<div class="empty">还没有提交过</div>`;
}

function initHome() {
  $("home").classList.remove("hidden");
  localStorage.removeItem("shop_access_key"); // 清除旧版本保存过的密钥
  $("submit").onclick = async () => {
    const code = $("code").value.trim();
    if (!code) { show($("submit-msg"), "warn", "请先输入卡密"); return; }
    try {
      const t = await api("POST", "/tasks", { text: $("share").value, code });
      const list = history();
      list.unshift({ page: t.page, url: t.url, created_at: t.created_at, expires_at: t.page_expires_at, remaining: t.remaining });
      localStorage.setItem(HISTORY_STORE, JSON.stringify(list));
      location.href = t.page;
    } catch (e) { showErr($("submit-msg"), e); }
  };
  renderHistory();
}

// ---- 专属页面 ------------------------------------------------------

const token = location.pathname.startsWith("/t/") ? location.pathname.slice(3) : null;
const pageExp = token ? Number(token.split(".")[1]) * 1000 : 0;
let timer = null;

function single(t) { return t.status === "done" && t.saved_to && t.saved_to !== "."; }

function renderTask(t) {
  const title = single(t) ? t.saved_to.split("/").pop() : "下载任务";
  const status = t.error && t.error.code === "interrupted" ? "已中断" : (STATUS[t.status] || t.status);
  const meta = [];
  if (t.total != null) meta.push(bytes(t.downloaded || 0) + " / " + bytes(t.total));
  if (t.speed != null) meta.push(bytes(t.speed) + "/s");
  if (t.eta != null) meta.push("剩余 " + eta(t.eta));
  let html = `<div class="top"><span class="title">${esc(title)}</span><span class="tag">${esc(status)}</span></div>
    <div class="meta">分享链接：${esc(t.url)}</div>
    <div class="meta">提交于 ${esc(localTime(t.created_at))}，本页过期于 ${esc(new Date(pageExp).toLocaleString())}</div>`;
  const mine = history().find(h => h.page === location.pathname);
  if (mine && mine.remaining != null) html += `<div class="meta">本次提交后卡密剩余 ${esc(mine.remaining)} 次</div>`;
  if (ACTIVE.includes(t.status)) html += `<div class="bar"><i style="width:${t.progress}%"></i></div>`;
  if (meta.length) html += `<div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>`;
  if (t.status === "failed" && t.error) html += `<div class="msg err">失败原因：${esc(t.error.hint || t.error.message)}</div>`;
  if (single(t)) {
    html += `<div class="row"><button id="dl">下载文件</button><button class="ghost" id="copy">复制链接</button></div>`;
  } else if (t.status === "done") {
    html += `<div class="msg warn">多文件任务暂不支持下载</div>`;
  }
  html += `<div class="msg" id="task-msg"></div>`;
  $("task-card").innerHTML = html;
  if (single(t)) {
    $("dl").onclick = () => link(url => { location.href = url; });
    $("copy").onclick = () => link(async (url, expires_at) => {
      await navigator.clipboard.writeText(url);
      show($("task-msg"), "ok", "已复制，有效期至 " + localTime(expires_at));
    });
  }
}

async function link(use) {
  try {
    const { url, expires_at } = await api("POST", `/t/${token}/link`);
    await use(url, expires_at);
  } catch (e) { showErr($("task-msg"), e.code ? e : { code: "copy_failed", message: "复制失败，请检查浏览器权限" }); }
}

async function refreshTask() {
  try {
    const t = await api("GET", `/t/${token}/task`);
    renderTask(t);
    if (ACTIVE.includes(t.status)) timer = setTimeout(refreshTask, 2000);
  } catch (e) {
    $("task-card").innerHTML = `<div class="msg err"></div>`;
    showErr($("task-card").querySelector(".msg"), e);
  }
}

if (token) {
  $("task").classList.remove("hidden");
  refreshTask();
} else {
  initHome();
}
</script>
</body>
</html>
