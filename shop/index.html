<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网盘文件下载</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6fa; color: #1f2733;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 8px 0 20px; }
  h1 a { color: inherit; text-decoration: none; }
  .card { background: #fff; border: 1px solid #e4e8ef; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  input, textarea { width: 100%; padding: 9px 12px; border: 1px solid #e4e8ef; border-radius: 8px; font: inherit; }
  textarea { min-height: 96px; resize: vertical; }
  button { border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; background: #2563eb; color: #fff; cursor: pointer; }
  button.ghost { background: #eef2ff; color: #2563eb; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 200px; }
  .msg { font-size: 14px; min-height: 20px; margin-top: 8px; }
  .ok { color: #16a34a; } .err { color: #dc2626; } .warn { color: #d97706; } .info { color: #2563eb; }
  .top { display: flex; justify-content: space-between; gap: 10px; }
  .title { font-weight: 600; word-break: break-all; }
  .tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #eef2f7; white-space: nowrap; height: fit-content; }
  .bar { height: 8px; background: #edf0f5; border-radius: 99px; margin: 10px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #2563eb; }
  .meta { color: #6b7686; font-size: 13px; word-break: break-all; }
  .meta span { margin-right: 14px; }
  .history a { display: block; padding: 10px 0; border-top: 1px solid #e4e8ef; color: #2563eb; text-decoration: none; word-break: break-all; }
  .history a:first-child { border-top: 0; }
  .empty { color: #6b7686; text-align: center; padding: 16px 0; }
  .pin { position: sticky; top: 8px; z-index: 20; margin-bottom: 16px; }
  .balance-card { border: 1px solid #c3d6fb; padding: 14px 16px;
                  background: linear-gradient(180deg, #f3f7ff, #ffffff 70%);
                  box-shadow: 0 8px 22px rgba(37, 99, 235, .14); }
  .balance-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bal { display: flex; align-items: center; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
  .bal .big { font-size: 34px; font-weight: 700; color: #2563eb; line-height: 1; min-width: 96px; }
  .bal .big small { display: block; font-size: 12px; font-weight: 500; color: #6b7686; margin-top: 5px; }
  .bal .rest { flex: 1; min-width: 180px; }
  .bal .kv { color: #6b7686; font-size: 13px; }
  .bal .kv b { color: #1f2733; font-size: 15px; }
  .bal .kv span { margin-right: 16px; }
  .bal .bar { margin: 8px 0 0; }
  .code-edit { margin-top: 12px; }
  .code-edit .row { margin-top: 8px; }
  .code-balance { border-top: 1px solid #dbe6fb; margin-top: 12px; padding-top: 4px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1><a href="/">网盘文件下载</a></h1>

  <div id="code-pin" class="pin">
    <div class="card balance-card" id="code-card">
      <div class="balance-head"><strong>卡密</strong></div>
      <div class="meta" id="billing-meta"></div>
      <div class="code-edit">
        <div class="row">
          <input id="code" type="password" placeholder="输入卡密" autocomplete="off">
          <button class="ghost" id="submit-code">提交</button>
          <button class="ghost" id="clear-code">清除</button>
        </div>
        <div class="meta">卡密保存在本浏览器，公共电脑用完请清除</div>
      </div>
    </div>
  </div>

  <div id="home" class="hidden">
    <div class="card">
      <textarea id="share" placeholder="粘贴百度网盘分享文字，例如：&#10;https://pan.baidu.com/s/1xxxx 提取码：abcd"></textarea>
      <div class="row"><button id="submit">提交下载</button></div>
      <div class="msg" id="submit-msg"></div>
    </div>

    <div class="card">
      <strong>我的历史</strong>
      <div class="meta">本浏览器提交过的下载页，24 小时后过期</div>
      <div class="history" id="history"></div>
    </div>
  </div>

  <div id="task" class="hidden">
    <div class="card" id="task-card"></div>
    <a href="/"><button>返回首页，提交新的下载</button></a>
  </div>
</div>

<script>
const BILLING_META = "__BILLING_META__";
document.getElementById("billing-meta").textContent = BILLING_META;
const HISTORY_STORE = "shop_history";
const CARD_STORE = "shop_card";
const CARD_REJECTED = ["card_invalid", "card_used", "card_type_mismatch", "card_disabled"];
const STATUS = { queued: "排队中", running: "下载中", done: "完成", failed: "失败", submitted: "网盘转存中，完成后自动下载" };
const ACTIVE = ["queued", "running", "submitted"];
const $ = id => document.getElementById(id);

const BALANCE_MS = 10000;
let balanceTimer = null;
let pollingCode = null;

async function api(method, path, body) {
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let json = null;
  try { json = await res.json(); } catch (e) {}
  if (!json || !json.ok) throw (json && json.error) || { code: "http_" + res.status, message: "请求失败" };
  return json.data;
}

function show(el, cls, text) { el.className = "msg " + cls; el.textContent = text; }
function showErr(el, e) { show(el, "err", e.code + "：" + (e.hint || e.message)); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function localTime(iso) { return new Date(iso).toLocaleString(); }

function bytes(n) {
  const u = ["B", "kB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}
function eta(s) {
  if (s >= 3600) return Math.floor(s / 3600) + "小时" + Math.floor(s % 3600 / 60) + "分";
  if (s >= 60) return Math.floor(s / 60) + "分" + s % 60 + "秒";
  return s + "秒";
}

// ---- 常驻置顶卡密组件 ----------------------------------------------

function stopBalancePoll() {
  if (balanceTimer) { clearTimeout(balanceTimer); balanceTimer = null; }
  pollingCode = null;
}

function pct(remaining, uses) {
  if (!uses || uses <= 0) return 0;
  return Math.max(0, Math.min(100, Math.round(remaining / uses * 100)));
}

function currentInput() {
  const el = $("code");
  return el ? el.value : (localStorage.getItem(CARD_STORE) || "");
}

function renderCard({ balance, cost, totalBytes, live, message, msgCls } = {}) {
  const saved = localStorage.getItem(CARD_STORE) || "";
  const value = currentInput() || saved;
  let html = `
    <div class="balance-head"><strong>卡密</strong>`;
  if (balance) html += live ? `<span class="tag">自动刷新</span>`
                            : `<span class="tag">提交时快照</span>`;
  html += `</div>
    <div class="meta">${esc(BILLING_META)}</div>
    <div class="code-edit">
      <div class="row">
        <input id="code" type="password" placeholder="输入卡密" autocomplete="off" value="${esc(value)}">
        <button class="ghost" id="submit-code">提交</button>
        <button class="ghost" id="clear-code">清除</button>
      </div>
      <div class="meta">卡密保存在本浏览器，公共电脑用完请清除</div>`;
  if (message) html += `<div class="msg ${esc(msgCls || "")}">${esc(message)}</div>`;
  html += `</div>`;

  if (balance) {
    const { remaining, used, uses } = balance;
    const p = pct(remaining, uses);
    html += `<div class="code-balance"><div class="bal">
        <div class="big">${esc(remaining)}<small>剩余次数</small></div>
        <div class="rest">`;
    if (cost != null) {
      html += `<div class="kv"><span>本任务消耗 <b>${esc(cost)}</b> 次`;
      if (totalBytes != null) html += `（大小 ${esc(bytes(totalBytes))}）`;
      html += `</span></div>`;
    }
    html += `<div class="kv"><span>总次数 <b>${esc(uses)}</b></span><span>已用 <b>${esc(used)}</b></span></div>
          <div class="bar"><i style="width:${p}%"></i></div>
        </div></div></div>`;
  }

  $("code-card").innerHTML = html;
  bindCard();
}

function bindCard() {
  $("submit-code").onclick = () => {
    const code = $("code").value.trim();
    if (!code) { renderCard({ message: "请先输入卡密", msgCls: "warn" }); return; }
    localStorage.setItem(CARD_STORE, code);
    startBalancePoll(code);
  };
  $("clear-code").onclick = () => {
    localStorage.removeItem(CARD_STORE);
    stopBalancePoll();
    renderCard({ message: "已清除本浏览器保存的卡密", msgCls: "ok" });
  };
}

async function refreshBalance(code) {
  try {
    const d = await api("POST", "/card/status", { code });
    renderCard({ balance: d, live: true });
  } catch (e) {
    stopBalancePoll();
    renderCard({ message: e.code + "：" + (e.hint || e.message), msgCls: "err" });
    return;
  }
  if (pollingCode === code) balanceTimer = setTimeout(() => refreshBalance(code), BALANCE_MS);
}

function startBalancePoll(code) {
  stopBalancePoll();
  pollingCode = code;
  refreshBalance(code);
}

function renderCardSnapshot(mine) {
  if (!mine || mine.remaining == null || mine.uses == null) {
    renderCard();
    return;
  }
  const used = mine.uses - mine.remaining;
  renderCard({ balance: { remaining: mine.remaining, used, uses: mine.uses },
               cost: mine.cost, totalBytes: mine.total_bytes, live: false });
}

// ---- 首页 ----------------------------------------------------------

function history() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(HISTORY_STORE)) || []; } catch (e) {}
  const alive = list.filter(h => new Date(h.expires_at) > new Date());
  if (alive.length !== list.length) localStorage.setItem(HISTORY_STORE, JSON.stringify(alive));
  return alive;
}

function renderHistory() {
  const list = history();
  $("history").innerHTML = list.length
    ? list.map(h => {
        const bits = [];
        if (h.title) bits.push(h.url);
        bits.push(`提交于 ${localTime(h.created_at)}`, `过期于 ${localTime(h.expires_at)}`);
        if (h.cost != null) bits.push(`扣 ${h.cost} 次`);
        if (h.remaining != null) bits.push(`剩余 ${h.remaining} 次`);
        const main = h.title || h.url;
        return `<a href="${esc(h.page)}">${esc(main)}<div class="meta">${esc(bits.join("，"))}</div></a>`;
      }).join("")
    : `<div class="empty">还没有提交过</div>`;
}

function initHome() {
  $("home").classList.remove("hidden");
  localStorage.removeItem("shop_access_key"); // 清除旧版本保存过的密钥
  const saved = localStorage.getItem(CARD_STORE) || "";
  renderCard();
  if (saved) startBalancePoll(saved);

  $("submit").onclick = async () => {
    const code = (currentInput() || "").trim();
    if (!code) { show($("submit-msg"), "warn", "请先输入卡密"); return; }
    $("submit").disabled = true;
    try {
      const t = await api("POST", "/tasks", { text: $("share").value, code });
      localStorage.setItem(CARD_STORE, code);
      const list = history();
      list.unshift({ page: t.page, url: t.url, title: t.title, created_at: t.created_at,
                     expires_at: t.page_expires_at, remaining: t.remaining, cost: t.cost,
                     uses: t.uses, total_bytes: t.total_bytes });
      localStorage.setItem(HISTORY_STORE, JSON.stringify(list));
      location.href = t.page;
    } catch (e) {
      if (CARD_REJECTED.includes(e.code)) localStorage.removeItem(CARD_STORE);
      showErr($("submit-msg"), e);
    } finally {
      $("submit").disabled = false;
    }
  };
  renderHistory();
}

// ---- 专属页面 ------------------------------------------------------

const token = location.pathname.startsWith("/t/") ? location.pathname.slice(3) : null;
const pageExp = token ? Number(token.split(".")[1]) * 1000 : 0;
let timer = null;

function single(t) { return t.status === "done" && t.saved_to && t.saved_to !== "."; }

function renderTask(t) {
  const mine = history().find(h => h.page === location.pathname);
  renderCardSnapshot(mine);
  const title = single(t) ? t.saved_to.split("/").pop()
    : (mine && mine.title) ? mine.title
    : "下载任务";
  const status = t.error && t.error.code === "interrupted" ? "已中断" : (STATUS[t.status] || t.status);
  const meta = [];
  if (t.total != null) meta.push(bytes(t.downloaded || 0) + " / " + bytes(t.total));
  if (t.speed != null) meta.push(bytes(t.speed) + "/s");
  if (t.eta != null) meta.push("剩余 " + eta(t.eta));
  let html = `<div class="top"><span class="title">${esc(title)}</span><span class="tag">${esc(status)}</span></div>
    <div class="meta">分享链接：${esc(t.url)}</div>
    <div class="meta">提交于 ${esc(localTime(t.created_at))}，本页过期于 ${esc(new Date(pageExp).toLocaleString())}</div>`;
  if (ACTIVE.includes(t.status)) html += `<div class="bar"><i style="width:${t.progress}%"></i></div>`;
  if (ACTIVE.includes(t.status)) html += `<div class="msg info">请耐心等待，文件下载完成后才会生成下载链接。</div>`;
  if (meta.length) html += `<div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>`;
  if (t.status === "failed" && t.error) html += `<div class="msg err">失败原因：${esc(t.error.hint || t.error.message)}</div>`;
  if (t.status === "failed") {
    html += t.retries_left > 0
      ? `<div class="row"><button id="retry">重试（剩余 ${esc(t.retries_left)} 次）</button><span class="meta">不扣卡密次数</span></div>`
      : `<div class="msg warn">本页面重试次数已用完，请返回首页重新提交</div>`;
  }
  if (single(t)) {
    html += `<div class="row"><button id="dl">下载文件</button><button class="ghost" id="copy">复制链接</button></div>`;
  } else if (t.status === "done") {
    html += `<div class="msg warn">任务已完成，但没有可下载的单个文件</div>`;
  }
  html += `<div class="msg" id="task-msg"></div>`;
  $("task-card").innerHTML = html;
  if ($("retry")) $("retry").onclick = retry;
  if (single(t)) {
    $("dl").onclick = () => link(url => { location.href = url; });
    $("copy").onclick = () => link(async (url, expires_at) => {
      await navigator.clipboard.writeText(url);
      show($("task-msg"), "ok", "已复制，有效期至 " + localTime(expires_at));
    });
  }
}

async function link(use) {
  try {
    const { url, expires_at } = await api("POST", `/t/${token}/link`);
    await use(url, expires_at);
  } catch (e) { showErr($("task-msg"), e.code ? e : { code: "copy_failed", message: "复制失败，请检查浏览器权限" }); }
}

async function retry() {
  $("retry").disabled = true;
  try {
    await api("POST", `/t/${token}/retry`);
    clearTimeout(timer);
    await refreshTask();
  } catch (e) {
    $("retry").disabled = false;
    showErr($("task-msg"), e);
  }
}

async function refreshTask() {
  try {
    const t = await api("GET", `/t/${token}/task`);
    renderTask(t);
    if (ACTIVE.includes(t.status)) timer = setTimeout(refreshTask, 2000);
  } catch (e) {
    $("task-card").innerHTML = `<div class="msg err"></div>`;
    showErr($("task-card").querySelector(".msg"), e);
  }
}

if (token) {
  $("task").classList.remove("hidden");
  refreshTask();
} else {
  initHome();
}
</script>
</body>
</html>
