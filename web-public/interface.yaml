name: web-public
function: 公开下载页：粘贴分享链接下载、查看进度、获取下载链接
modules: []
input: []
output:
  - name: index.html
    type: static page
    desc: 由服务在 GET /public 提供的单个静态页面
contract:
  - 只调用本服务 POST /api/tasks、GET /api/tasks、POST /api/tasks/{id}/link
  - 单文件自包含，不依赖前端构建与外部 CDN，不引用管理页资源
  - 不含网盘管理、bdpan 登录、任务重试与删除
  - 访问密钥（输入、保存、清除）只保存在浏览器本地；未设置密钥时提示先输入
  - 粘贴分享文字提交；成功后显示任务 ID 并刷新列表
  - 任务列表新任务在前；每个任务显示标题、状态、进度条、已下载/总大小、速度、剩余时间，失败时显示原因；有未结束任务时每 2 秒刷新
  - 完成且 saved_to 为单个文件的任务有「下载文件」与「复制链接」；完成的多文件任务提示暂不支持下载
  - 接口错误显示 error.code 与 message，有 hint 时优先显示 hint
depends:
  - app/api
errors: []
tests:
  - 服务 GET /public 返回该页面
  - 手动清单：输入密钥 → 粘贴分享文字提交 → 看到进度并刷新到完成 → 下载文件、复制链接可用 → 错误密钥时显示 unauthorized
