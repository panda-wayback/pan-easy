<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网盘文件下载</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6fa; color: #1f2733;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 8px 0 20px; }
  .card { background: #fff; border: 1px solid #e4e8ef; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  input, textarea { width: 100%; padding: 9px 12px; border: 1px solid #e4e8ef; border-radius: 8px; font: inherit; }
  textarea { min-height: 96px; resize: vertical; }
  button { border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; background: #2563eb; color: #fff; cursor: pointer; }
  button.ghost { background: #eef2ff; color: #2563eb; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 200px; }
  .msg { font-size: 14px; min-height: 20px; margin-top: 8px; }
  .ok { color: #16a34a; } .err { color: #dc2626; } .warn { color: #d97706; }
  .task { padding: 14px 0; border-top: 1px solid #e4e8ef; }
  .task:first-child { border-top: 0; }
  .top { display: flex; justify-content: space-between; gap: 10px; }
  .title { font-weight: 600; word-break: break-all; }
  .tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #eef2f7; white-space: nowrap; height: fit-content; }
  .bar { height: 8px; background: #edf0f5; border-radius: 99px; margin: 10px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #2563eb; }
  .meta { color: #6b7686; font-size: 13px; }
  .meta span { margin-right: 14px; }
  .empty { color: #6b7686; text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>网盘文件下载</h1>

  <div class="card">
    <strong>访问密钥</strong>
    <div class="row">
      <input id="key" type="password" placeholder="输入访问密钥">
      <button id="key-save">保存</button>
      <button id="key-clear" class="ghost">清除</button>
    </div>
    <div class="msg" id="key-msg"></div>
  </div>

  <div class="card">
    <textarea id="share" placeholder="粘贴百度网盘分享文字，例如：&#10;https://pan.baidu.com/s/1xxxx 提取码：abcd"></textarea>
    <div class="row"><button id="submit">提交下载</button></div>
    <div class="msg" id="submit-msg"></div>
  </div>

  <div class="card">
    <strong>任务</strong>
    <div class="msg" id="list-msg"></div>
    <div id="tasks"></div>
  </div>
</div>

<script>
const KEY_STORE = "baidu_easy_public_key";
const STATUS = { queued: "排队中", running: "下载中", done: "完成", failed: "失败", submitted: "转存已提交，尚未完成" };
const $ = id => document.getElementById(id);
let timer = null;

function key() { return localStorage.getItem(KEY_STORE) || ""; }

async function api(method, path, body) {
  const headers = { Authorization: "Bearer " + key() };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let json = null;
  try { json = await res.json(); } catch (e) {}
  if (!json || !json.ok) throw (json && json.error) || { code: "http_" + res.status, message: "请求失败" };
  return json.data;
}

function show(el, cls, text) { el.className = "msg " + cls; el.textContent = text; }
function showErr(el, e) { show(el, "err", e.code + "：" + (e.hint || e.message)); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function bytes(n) {
  const u = ["B", "kB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}
function eta(s) {
  if (s >= 3600) return Math.floor(s / 3600) + "小时" + Math.floor(s % 3600 / 60) + "分";
  if (s >= 60) return Math.floor(s / 60) + "分" + s % 60 + "秒";
  return s + "秒";
}
function single(t) { return t.status === "done" && t.saved_to && t.saved_to !== "."; }

function card(t) {
  const title = single(t) ? t.saved_to.split("/").pop() : t.url;
  const status = t.error && t.error.code === "interrupted" ? "已中断" : (STATUS[t.status] || t.status);
  const meta = [];
  if (t.total != null) meta.push(bytes(t.downloaded || 0) + " / " + bytes(t.total));
  if (t.speed != null) meta.push(bytes(t.speed) + "/s");
  if (t.eta != null) meta.push("剩余 " + eta(t.eta));
  let html = `<div class="task"><div class="top"><span class="title">${esc(title)}</span><span class="tag">${esc(status)}</span></div>`;
  if (t.status === "queued" || t.status === "running") html += `<div class="bar"><i style="width:${t.progress}%"></i></div>`;
  if (meta.length) html += `<div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>`;
  if (t.status === "failed" && t.error) html += `<div class="msg err">失败原因：${esc(t.error.hint || t.error.message)}</div>`;
  if (single(t)) {
    html += `<div class="row"><button data-dl="${t.id}">下载文件</button><button class="ghost" data-copy="${t.id}">复制链接</button></div>
             <div class="msg" id="msg-${t.id}"></div>`;
  } else if (t.status === "done") {
    html += `<div class="msg warn">多文件任务暂不支持下载</div>`;
  }
  return html + "</div>";
}

async function refresh() {
  clearTimeout(timer);
  if (!key()) { show($("list-msg"), "warn", "请先输入访问密钥"); $("tasks").innerHTML = ""; return; }
  try {
    const tasks = await api("GET", "/api/tasks");
    show($("list-msg"), "", "");
    $("tasks").innerHTML = tasks.length ? tasks.map(card).join("") : `<div class="empty">还没有任务</div>`;
    if (tasks.some(t => t.status === "queued" || t.status === "running")) timer = setTimeout(refresh, 2000);
  } catch (e) { showErr($("list-msg"), e); }
}

$("key").value = key();
$("key-save").onclick = () => {
  localStorage.setItem(KEY_STORE, $("key").value.trim());
  show($("key-msg"), "ok", "已保存在本浏览器");
  refresh();
};
$("key-clear").onclick = () => {
  localStorage.removeItem(KEY_STORE);
  $("key").value = "";
  show($("key-msg"), "ok", "已清除");
  refresh();
};

$("submit").onclick = async () => {
  try {
    const t = await api("POST", "/api/tasks", { text: $("share").value });
    show($("submit-msg"), "ok", "已提交，任务 ID：" + t.id);
    $("share").value = "";
    refresh();
  } catch (e) { showErr($("submit-msg"), e); }
};

$("tasks").onclick = async ev => {
  const id = ev.target.dataset.dl || ev.target.dataset.copy;
  if (!id) return;
  const msg = $("msg-" + id);
  try {
    const { url, expires_at } = await api("POST", `/api/tasks/${id}/link`);
    if (ev.target.dataset.dl) {
      location.href = url;
    } else {
      await navigator.clipboard.writeText(url);
      show(msg, "ok", "已复制，有效期至 " + new Date(expires_at).toLocaleString());
    }
  } catch (e) { showErr(msg, e.code ? e : { code: "copy_failed", message: "复制失败，请检查浏览器权限" }); }
};

refresh();
</script>
</body>
</html>
